<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>InterviewPulse</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="main-container">

    <!-- HERO -->

    <div class="hero-section">

        <h1>
            INTERVIEW<span>PULSE</span>
        </h1>

        <p>
            Futuristic AI Interview Assessment Platform
        </p>

    </div>

    <!-- CONTROLS -->

    <div class="control-panel">

        <div class="input-group">

            <label>ROLE</label>

            <select id="role">

                <option>Software Developer</option>
                <option>Data Scientist</option>
                <option>AI/ML Engineer</option>
                <option>Data Analyst</option>
                <option>HR Interview</option>

            </select>

        </div>

        <div class="input-group">

            <label>INTERVIEW STYLE</label>

            <select id="style">

                <option>Google Style</option>
                <option>Startup Style</option>
                <option>TCS/Infosys Style</option>

            </select>

        </div>

        <button
            onclick="startInterview()"
            class="start-btn">

            START INTERVIEW

        </button>

    </div>

    <!-- TIMER -->

    <div class="timer-box">

        ⏳ Time Left:
        <span id="timer">
            00:00
        </span>

    </div>

    <!-- QUESTION -->

    <div class="glass-card">

        <div class="card-header">

            QUESTION
            <span id="questionCount">
                0/10
            </span>

        </div>

        <div
            id="question"
            class="question-text">

            Press Start Interview

        </div>

    </div>

    <!-- ANSWER -->

    <div class="glass-card">

        <div class="card-header">

            YOUR ANSWER

        </div>

        <textarea
            id="answer"
            placeholder="Your speech will appear here..."
        ></textarea>

        <!-- VOICE CONTROLS -->

        <div class="voice-controls">

            <button
                onclick="startVoiceInput()"
                class="voice-btn">

                🎤 START SPEAKING

            </button>

            <button
                onclick="stopVoiceInput()"
                class="stop-btn">

                ⏹ STOP SPEAKING

            </button>

        </div>

        <div
            class="voice-status"
            id="voiceStatus">

            Voice Assistant Idle

        </div>

        <!-- VISUALIZER -->

        <div class="audio-visualizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <!-- NEXT -->

        <button
            onclick="submitAnswer()"
            class="submit-btn">

            NEXT QUESTION

        </button>

    </div>

    <!-- FEEDBACK -->

    <div class="glass-card feedback-card">

        <div class="card-header">

            AI FEEDBACK

        </div>

        <pre id="feedback">

Waiting for response...

        </pre>

    </div>

</div>

<script>

let questions = [];

let currentQuestionIndex = 0;

let recognition;

let timerInterval;

let timeLeft = 0;

/* =========================================
   START INTERVIEW
========================================= */

async function startInterview() {

    const role =
        document.getElementById("role").value;

    const style =
        document.getElementById("style").value;

    document.getElementById("question").innerText =
        "Generating interview questions...";

    const response = await fetch("/start", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            role,
            style
        })

    });

    const data = await response.json();

    questions = data.questions;

    currentQuestionIndex = 0;

    showQuestion();
}

/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion() {

    if (currentQuestionIndex >= questions.length) {

        document.getElementById("question").innerText =
            "✅ Interview Completed";

        document.getElementById("timer").innerText =
            "00:00";

        return;
    }

    const question =
        questions[currentQuestionIndex];

    document.getElementById("question").innerText =
        question;

    document.getElementById("questionCount").innerText =
        `${currentQuestionIndex + 1}/10`;

    document.getElementById("answer").value = "";

    startTimer(question);
}

/* =========================================
   TIMER
========================================= */

function startTimer(question) {

    clearInterval(timerInterval);

    const words =
        question.split(" ").length;

    timeLeft =
        Math.max(20, words * 3);

    updateTimer();

    timerInterval = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            stopVoiceInput();

            submitAnswer();
        }

    }, 1000);
}

function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;

    document.getElementById("timer").innerText =
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

/* =========================================
   VOICE INPUT
========================================= */

function startVoiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Speech Recognition not supported."
        );

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = true;

    recognition.interimResults = true;

    const answerBox =
        document.getElementById("answer");

    const voiceStatus =
        document.getElementById("voiceStatus");

    const visualizer =
        document.querySelector(".audio-visualizer");

    let finalTranscript = "";

    recognition.start();

    visualizer.classList.add("active");

    voiceStatus.innerText =
        "🎤 Listening...";

    recognition.onresult = function(event) {

        let interimTranscript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const transcript =
                event.results[i][0].transcript;

            if (event.results[i].isFinal) {

                finalTranscript += transcript + " ";

            } else {

                interimTranscript += transcript;
            }
        }

        answerBox.value =
            finalTranscript + interimTranscript;
    };

    recognition.onend = function() {

        visualizer.classList.remove("active");

        voiceStatus.innerText =
            "✅ Voice Captured";
    };
}

/* =========================================
   STOP SPEAKING
========================================= */

function stopVoiceInput() {

    if (recognition) {

        recognition.stop();

        document.querySelector(
            ".audio-visualizer"
        ).classList.remove("active");

        document.getElementById(
            "voiceStatus"
        ).innerText =
            "⏹ Recording Stopped";
    }
}

/* =========================================
   SUBMIT ANSWER
========================================= */

async function submitAnswer() {

    clearInterval(timerInterval);

    const answer =
        document.getElementById("answer").value;

    const question =
        questions[currentQuestionIndex];

    document.getElementById("feedback").innerText =
        "Analyzing response...";

    const response = await fetch("/submit", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            question,
            answer
        })

    });

    const data = await response.json();

    document.getElementById("feedback").innerText =
        data.feedback;

    currentQuestionIndex++;

    setTimeout(() => {

        showQuestion();

    }, 4000);
}

</script>

</body>
</html>
